<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="GYANSETU (ज्ञानसेतु) – AI-powered career transformation: career matching, skill-gap analysis, learning paths, mock interviews and resume builder in Marathi, Hindi and English.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GYANSETU Learner Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;700;800&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans:wght@400;600&display=swap">
</head>
<body>
<style>
/* Layout: app shell — left sidebar nav + top bar; dashboard = KPI row then two-column card grid */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#16192B; --muted:#5A607A; --line:#DFE2EC;
  --indigo:#1F3A93; --indigo-soft:#E8ECF8; --nav:#14245E; --nav-ink:#C9D3F5;
  --saffron:#E07A12; --saffron-soft:#FDF0E1; --green:#138A4B; --green-soft:#E3F4EA;
  --amber:#A86400; --amber-soft:#FBF0DC; --ai:#EEF1FB; --focus:#E07A12;
  --paper:#FFFFFF; --paper-ink:#111111; --paper-muted:#4A4A4A; --paper-accent:#1F3A93; --paper-rule:#9A9A9A;
  --f-display:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  --f-body:"Noto Sans","Noto Sans Devanagari",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#171B2D; --ink:#E9EBF5; --muted:#A3A9C4; --line:#2A3050;
  --indigo:#8FA6F0; --indigo-soft:#222A4A; --nav:#0A0D1A; --nav-ink:#A9B4DA;
  --saffron:#F4A04A; --saffron-soft:#3A2A16; --green:#4CC78A; --green-soft:#16301F;
  --amber:#E8B04A; --amber-soft:#352A12; --ai:#1E2440; --focus:#F4A04A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#171B2D; --ink:#E9EBF5; --muted:#A3A9C4; --line:#2A3050;
  --indigo:#8FA6F0; --indigo-soft:#222A4A; --nav:#0A0D1A; --nav-ink:#A9B4DA;
  --saffron:#F4A04A; --saffron-soft:#3A2A16; --green:#4CC78A; --green-soft:#16301F;
  --amber:#E8B04A; --amber-soft:#352A12; --ai:#1E2440; --focus:#F4A04A; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--indigo)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--nav);color:var(--nav-ink);padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;
  padding-left:max(14px,env(safe-area-inset-left,0px))}
.logo{padding:0 8px}
.logo b{font-family:var(--f-display);font-size:22px;color:#fff;letter-spacing:.5px;display:block}
.logo span{font-family:var(--f-display);color:#F4A04A;font-size:18px;font-weight:700}
.logo small{display:block;font-size:11px;color:var(--nav-ink);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--nav-ink);padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;font-size:14px}
.nav button svg{width:18px;height:18px;flex:0 0 18px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.side-foot{margin-top:auto;font-size:11.5px;line-height:1.45;padding:0 8px;color:var(--nav-ink)}
.main{min-width:0;padding-right:max(24px,env(safe-area-inset-right,0px));padding-left:24px;padding-block:0 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px;border-bottom:1px solid var(--line);margin-bottom:20px}
.who{display:flex;align-items:center;gap:10px;min-width:0;max-width:100%}
.who>div{min-width:0}
#whoSel{max-width:100%;width:100%}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--indigo-soft);color:var(--indigo);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px}
.who label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block}
select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:6px 13px;cursor:pointer;font-size:13.5px}
.lang button[aria-pressed="true"]{background:var(--indigo);color:var(--surface)}
.demo-pill{font-size:11.5px;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:4px 10px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:28px;font-weight:700}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.goal{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.goal label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block}
.goal select{font-weight:600;border:0;padding:0;background:transparent;font-family:var(--f-display);font-size:16px;color:var(--indigo)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .num{font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.dash{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.card-h h3{font-size:17px}
.linkbtn{border:0;background:none;color:var(--indigo);cursor:pointer;font-size:13px;font-weight:600;padding:0}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.b-self{background:var(--bg);color:var(--muted)}
.b-ver{background:var(--green-soft);color:var(--green);border-color:transparent}
.b-gap{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.b-ess{background:var(--indigo-soft);color:var(--indigo);border-color:transparent}
.b-act{background:var(--saffron-soft);color:var(--saffron);border-color:transparent}
.btn{border:1px solid var(--indigo);background:var(--indigo);color:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13.5px}
.btn.ghost{background:transparent;color:var(--indigo)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .note{font-size:12.5px;color:var(--muted)}
.banner{background:var(--saffron-soft);border-radius:10px;padding:10px 14px;font-size:13.5px}
.ai{background:var(--ai);border-radius:10px;padding:12px 14px;font-size:14px}
.ai .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--indigo);font-weight:700;display:block;margin-bottom:4px}
.formula{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--bg);border-radius:8px;padding:8px 12px;overflow-x:auto;white-space:pre}
/* mini gap list */
.mg{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 64px;gap:10px;align-items:center;padding-block:7px;border-bottom:1px dashed var(--line);font-size:13.5px}
.mg:last-child{border-bottom:0}
.mg .nm small{display:block;font-size:11.5px;color:var(--muted)}
.scale{position:relative;height:14px;background:var(--bg);border-radius:5px;border:1px solid var(--line)}
.scale.lg{height:22px}
.scale .cur{position:absolute;left:0;top:0;bottom:0;background:var(--indigo);border-radius:4px 0 0 4px;opacity:.85}
.scale .gp{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--amber-soft) 0 6px,transparent 6px 10px);border:1px dashed var(--amber)}
.scale .tgt{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--saffron);border-radius:2px}
.scale .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.mg .v{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
/* path */
.path{display:flex;flex-direction:column}
.ps{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;padding-block:8px;position:relative}
.ps .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--line);color:var(--muted);position:relative;z-index:1}
.ps.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.ps.active .dot{background:var(--saffron);border-color:var(--saffron);color:#fff}
.ps:not(:last-child)::before{content:"";position:absolute;left:13px;top:34px;bottom:-8px;width:2px;background:var(--line)}
.ps h4{font-size:15px;font-family:var(--f-body);font-weight:600}
.ps .note{margin-top:1px}
.res{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.res a{font-size:12.5px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:var(--bg)}
.res a small{color:var(--muted)}
/* matches */
.mm{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:8px;align-items:center;padding-block:8px;border-bottom:1px dashed var(--line)}
.mm:last-child{border-bottom:0}
.mm b{font-family:var(--f-display);font-size:15px}
.mm .fit{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--indigo);text-align:right;font-variant-numeric:tabular-nums}
.meter{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--indigo)}
/* full career cards */
.cards{display:flex;flex-direction:column;gap:12px}
.ccard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.ccard.sel{border-color:var(--indigo);box-shadow:inset 0 0 0 1px var(--indigo)}
.ccard .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.ccard h4{font-size:19px}
.ccard .rank{color:var(--saffron);font-weight:800;margin-right:6px}
.fitnum{font-family:var(--f-display);font-size:24px;font-weight:800;color:var(--indigo);font-variant-numeric:tabular-nums}
.fitnum small{font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
.comp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:640px){.comp{grid-template-columns:repeat(2,minmax(0,1fr))}}
.comp div{font-size:11.5px;color:var(--muted)}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.reasons span{font-size:12.5px;background:var(--green-soft);color:var(--green);padding:3px 9px;border-radius:999px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(110px,180px) minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:9px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--indigo)}
.bar .val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kv div{background:var(--bg);border-radius:10px;padding:10px 12px}
.kv b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.log{display:flex;flex-direction:column;gap:6px;font-size:13px}
.log div{background:var(--green-soft);color:var(--green);border-radius:8px;padding:6px 10px}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-width:760px}
.msg{padding:10px 14px;border-radius:12px;max-width:90%;font-size:14px}
.msg.u{align-self:flex-end;background:var(--indigo);color:var(--surface)}
.msg.a{align-self:flex-start;background:var(--ai)}
.msg.a .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--indigo);font-weight:700;display:block;margin-bottom:3px}
.msg .src{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chips button:hover{border-color:var(--indigo)}
/* own form */
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px;background:var(--surface)}
legend{font-weight:600;padding:0 6px;font-family:var(--f-display);font-size:16px}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:6px;border-bottom:1px dashed var(--line);font-size:14px}
.q:last-child{border-bottom:0}
@media (max-width:640px){.q{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg label{padding:5px 10px;font-size:13px;cursor:pointer;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--indigo);color:var(--surface)}
.seg label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:-2px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.checks label:has(input:checked){border-color:var(--indigo);background:var(--indigo-soft)}
input[type=range]{width:200px;max-width:100%;accent-color:var(--indigo)}
/* toolkit */
.pq-grid{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px;align-items:start}
.pq-skills{display:flex;flex-direction:column;gap:6px;max-height:540px;overflow:auto}
.pq-skill{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.pq-skill.on{border-color:var(--indigo);box-shadow:inset 0 0 0 1px var(--indigo);background:var(--indigo-soft)}
.pq-q{font-size:17px;font-weight:600;margin:4px 0 12px}
.pq-opts{display:flex;flex-direction:column;gap:8px}
.pq-opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px;color:var(--ink)}
.pq-opt span{font-weight:700;color:var(--indigo);min-width:16px}
.pq-opt.sel{border-color:var(--indigo);background:var(--indigo-soft)}
.pq-opt.ok{border-color:var(--green);background:var(--green-soft)}
.pq-opt.bad{border-color:var(--amber);background:var(--amber-soft)}
.pq-opt:disabled{cursor:default}
.big{font-family:var(--f-display);font-size:34px;font-weight:800;color:var(--indigo);font-variant-numeric:tabular-nums}
.fb{align-self:flex-end;max-width:90%;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.stars{color:var(--saffron);letter-spacing:2px}
.iv-input{margin-top:14px;display:flex;flex-direction:column;gap:8px}
textarea,input:not([type]){width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font:inherit;color:var(--ink);resize:vertical}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-size:12px;color:var(--muted);font-weight:600}
.fld2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.cv{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:8px;padding:22px 24px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.45}
.cv h1{font-family:Arial,Helvetica,sans-serif;font-size:22px;margin:0}
.cv h2{font-family:Arial,Helvetica,sans-serif;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--paper-rule);padding-bottom:3px;margin:14px 0 6px;color:var(--paper-accent)}
.cv ul{margin:4px 0;padding-left:18px}.cv p{margin:4px 0}.cv-c{color:var(--paper-muted)}.cv-r{color:var(--paper-accent);font-weight:700;margin-top:2px}.cv-f{color:var(--paper-muted);font-size:11px;margin-top:14px}
.checks-list{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.tk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tk button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);text-align:left}
.tk button svg{width:20px;height:20px;color:var(--indigo)}
.tk button:hover{border-color:var(--indigo)}
@media (max-width:900px){.pq-grid,.res-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.fld2{grid-template-columns:minmax(0,1fr)}.tk{grid-template-columns:minmax(0,1fr)}}
/* mobile */
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:sticky;top:0;height:auto;z-index:5;padding:10px max(16px,env(safe-area-inset-left,0px)) 8px;padding-right:max(16px,env(safe-area-inset-right,0px));gap:8px;
    padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .logo small,.side-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
  .nav button{flex:0 0 auto;padding:7px 10px;font-size:13px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .kpis{grid-template-columns:minmax(0,1fr)}
  .mg{grid-template-columns:minmax(0,1fr) 56px}.mg .scale{grid-column:1/-1;order:3}
}
@media (prefers-reduced-motion:no-preference){.fill,.meter i,.scale .cur,.ring-fg{transition:all .5s ease}}
</style>

<div class="app">
  <aside class="sidebar">
    <div class="logo"><b>GYANSETU</b><span>ज्ञानसेतु</span><small id="tag"></small></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="side-foot" id="sidefoot"></div>

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${fmt(val)} / 100"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/><circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--saffron)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="var(--ink)" font-family="Mukta, sans-serif" font-weight="800" font-size="${size*0.28}">${fmt(val)}</text></svg>`; }

function ivTopSkills(c){ return c.req.slice().sort((a,b)=>b[2]-a[2]).map(r=>r[0]); }
function ivQuestions(c, type, lang){
  const sk=ivTopSkills(c), cn=c.n[LI[lang]], s=i=>SK[sk[i%sk.length]].n[LI[lang]];
  const G=k=>tl(k,lang,{c:cn}), T=(k,i)=>tl(k,lang,{c:cn,s:s(i)});
  if(type==='hr') return [G('gq1'),G('gq2'),G('gq3'),G('gq4'),T('tq2',0)];
  if(type==='tech') return [G('gq1'),T('tq1',0),T('tq3',1),T('tq2',2),G('gq2')];
  return [G('gq1'),T('tq1',0),G('gq2'),T('tq3',1),G('gq3')];
}
const KW_GENERIC=new Set(['data','basics','fundamentals','skills','software','office','literacy','tools','digital','work','with','and','reading','handling','management']);
function skillKeywords(k){ const out=new Set(); SK[k].n.forEach(n=>n.split(/[\s&/(),\-]+/).forEach(w=>{ if(!w) return; if(/^[A-Z]{2,}$/.test(w) || (w.length>=4 && !KW_GENERIC.has(w.toLowerCase()))) out.add(w.toLowerCase()); })); return [...out]; }
function ruleFeedback(ans, c, lang){
  const words=(ans.trim().match(/\S+/g)||[]).length, low=ans.toLowerCase();
  const star=/(result|outcome|so that|because|learn|improv|increas|reduc|saved|%|\d|परिणाम|कारण|शिकलो|शिकले|सुधार|वाढ|कमी|नतीजा|सीखा|बढ़|घट)/i.test(ans);
  const kws=[]; c.req.forEach(([k])=>skillKeywords(k).forEach(w=>kws.push([k,w])));
  const hit=[...new Set(kws.filter(([k,w])=>low.includes(w)).map(([k])=>k))];
  let score=1; if(words>=25) score++; if(words>=50 && words<=260) score++; if(star) score++; if(hit.length) score++;
  score=Math.min(5,score);
  const good=[], imp=[];
  if(words<25) imp.push(tl('fbShort',lang)); else if(words>260) imp.push(tl('fbTooLong',lang)); else good.push(tl('fbLen',lang));
  if(star) good.push(tl('fbStarYes',lang)); else imp.push(tl('fbStarNo',lang));
  if(hit.length) good.push(tl('fbKeyYes',lang,{x:hit.map(k=>SK[k].n[LI[lang]]).join(', ')}));
  else imp.push(tl('fbKeyNo',lang,{x:ivTopSkills(c).slice(0,2).map(k=>SK[k].n[LI[lang]]).join(', ')}));
  return {score, good:good.join(' '), improve:imp.join(' ')};
}

Conduct the whole interview in ${LANG_NAME[lang]}, in simple words suitable for a first-generation learner.
Candidate background (facts only): ${factsFor(L,c,rep)}
Rules: ask exactly ONE question at a time, under 40 words; ask ${N} questions in total; adapt follow-ups to the candidate's answers and gaps; after each answer give fair, specific, kind feedback. Never promise a job or comment on caste, religion, gender or family.
Reply with ONLY a JSON object: {"feedback": null or {"score": 1-5, "good": "one sentence", "improve": "one sentence"}, "question": "your next question, or empty string when the interview is over", "done": true or false, "report": null or {"overall": 1-5, "strengths": ["two short items"], "improve": ["two short items"], "tip": "one sentence"}}.

}

  h+=`</section>`;
  if(V.done && V.report){ const R=V.report;
    h+=`<section class="card" style="margin-top:16px"><div class="card-h"><h3>${t('ivReport')}</h3><span class="fitnum">${fmt(R.overall,1)}<small>/5 ${t('ivOverall')}</small></span></div>
      <div class="two"><div><b>${t('ivStrengths')}</b><ul>${(R.strengths||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><b>${t('ivImprove')}</b><ul>${(R.improve||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
      ${R.tip?`<div class="ai"><span class="lab">${t('ivTip')}</span>${esc(R.tip)}</div>`:''}
      <div class="row" style="margin-top:12px"><button type="button" class="btn sm" data-act="iv-new">${t('ivAgain')}</button><button type="button" class="btn sm ghost" data-page="practice">${tr(S.nav.practice)}</button></div></section>`; }
  return h;
}
function ivRuleReport(V){
  const fbs=V.msgs.filter(m=>m.fb).map(m=>m.fb); const avg=fbs.length?fbs.reduce((a,f)=>a+f.score,0)/fbs.length:0;
  const goods=[...new Set(fbs.map(f=>f.good).filter(Boolean).join(' ').split(/(?<=[.।])\s+/).filter(Boolean))].slice(0,2);
  const imps=[...new Set(fbs.map(f=>f.improve).filter(Boolean).join(' ').split(/(?<=[.।])\s+/).filter(Boolean))].slice(0,2);
  return {overall:avg, strengths:goods, improve:imps, tip:tl('fbTip',V.lang)};
}
function ivFinish(V){
  V.done=true; V.busy=false;
  const fbs=V.msgs.filter(m=>m.fb); if(!V.report) V.report=ivRuleReport(V);
  if(fbs.length){ const avg=fbs.reduce((a,m)=>a+m.fb.score,0)/fbs.length; st.log.unshift(t('ivLog',{x:tr(goal().n),y:fmt(avg,1)})); }
}
async function ivAsk(){
  const V=st.iv; V.busy=true; render(); ivScroll();
  try{
    const out=await st.ai.json(V.turns, {cache:false});
    if(!out || typeof out!=='object') throw {code:'invalid_json'};
    V.turns.push({role:'assistant', content:JSON.stringify(out)});
    const lastMe=[...V.msgs].reverse().find(m=>m.who==='me');
    if(out.feedback && lastMe && !lastMe.fb){ const f=out.feedback; lastMe.fb={score:Math.max(1,Math.min(5,Math.round(+f.score||3))), good:String(f.good||''), improve:String(f.improve||'')}; }
    const answered=V.msgs.filter(m=>m.who==='me').length;
    if(out.done || answered>=V.N){ if(out.report) V.report={overall:+out.report.overall||0, strengths:(out.report.strengths||[]).map(String), improve:(out.report.improve||[]).map(String), tip:String(out.report.tip||'')}; ivFinish(V); }
    else if(out.question){ V.msgs.push({who:'ai', text:String(out.question)}); V.busy=false; }
    else throw {code:'invalid_json'};
  }catch(e){
    handleAiError(e); V.err=t('ivErr'); V.mode='rule'; V.busy=false;
    const c=goal(); V.qs=ivQuestions(c,V.type,V.lang);
    const lastMe=[...V.msgs].reverse().find(m=>m.who==='me');
    if(lastMe && !lastMe.fb) lastMe.fb=ruleFeedback(lastMe.text,c,V.lang);
    const asked=V.msgs.filter(m=>m.who==='ai').length;
    if(asked>=V.N && lastMe) ivFinish(V); else { V.qi=asked; V.msgs.push({who:'ai', text:V.qs[V.qi]}); V.qi++; }
  }
  if(st.page==='interview'){ render(); ivScroll(); }
}
function ivScroll(){ const el=document.getElementById('iv-answer'); if(el && !st.iv.busy) el.focus({preventScroll:true}); const ch=document.getElementById('iv-chat'); if(ch && ch.lastElementChild) ch.lastElementChild.scrollIntoView({block:'nearest'}); }
function ivStart(){
  const c=goal(), rep=gapReport(st.L,c), V=st.iv;
  V.active=true; V.msgs=[]; V.done=false; V.report=null; V.err=null; V.draft='';
  if(st.ai){ V.mode='ai'; V.turns=[{role:'user', content:ivRules(c,st.L,rep,V.lang,V.type,V.N)+'\n\nStart the interview now with your first question.'}]; ivAsk(); }
  else { V.mode='rule'; V.qs=ivQuestions(c,V.type,V.lang); V.qi=0; V.msgs.push({who:'ai', text:V.qs[0]}); V.qi=1; render(); ivScroll(); }
}
function ivSend(){
  const V=st.iv, el=document.getElementById('iv-answer'); const ans=(el?el.value:V.draft).trim(); if(!ans || V.busy) return;
  V.msgs.push({who:'me', text:ans}); V.draft='';
  if(V.mode==='ai'){ V.turns.push({role:'user', content:'Candidate answer: '+ans}); ivAsk(); return; }
  const c=goal(); V.msgs[V.msgs.length-1].fb=ruleFeedback(ans,c,V.lang);
  if(V.qi<V.N){ V.msgs.push({who:'ai', text:V.qs[V.qi]}); V.qi++; } else ivFinish(V);
  render(); ivScroll();
}

// ---------------- Resume builder ----------------
function resState(){
  st.resBy=st.resBy||{};
  if(!st.resBy[st.who]){ const d=RES_DEFAULTS[st.who]||{name:'',email:'',phone:'',city:'',edu:QUAL[st.L.qual].n[0],proj:'',exp:'',ach:''};
    st.resBy[st.who]=Object.assign({summary:''}, d); st.resBy[st.who].summary=templateSummary(); }
  return st.resBy[st.who];
}
function templateSummary(){
  const c=goal(), rep=gapReport(st.L,c), ord=learningOrder(rep,c);
  const ver=rep.rows.filter(r=>r.v).sort((a,b)=>b.v-a.v).slice(0,3).map(r=>`${SK[r.k].n[0]} (${LEVELS[r.v][0].toLowerCase()})`);
  return `Motivated ${QUAL[st.L.qual].n[0]} candidate seeking an entry-level ${c.n[0]} role. `+
    (ver.length?`Verified skills: ${ver.join(', ')}. `:'')+
    (ord.length?`Currently strengthening ${ord.slice(0,2).map(r=>SK[r.k].n[0]).join(' and ')} through a structured learning plan. `:'')+
    `Reliable, eager to learn and comfortable working in a team.`;
}
function lines(s){ return String(s||'').split('\n').map(x=>x.trim()).filter(Boolean); }
function resModel(){
  const R=resState(), c=goal(), rep=gapReport(st.L,c);
  const all=Object.keys(st.L.skills).map(k=>{ const e=st.L.skills[k]; return {k, v:e.v||0, s:e.s||0, src:e.src}; });
  const ver=all.filter(x=>x.v>0).sort((a,b)=>b.v-a.v), fam=all.filter(x=>!x.v && x.s>0);
  const proj=lines(R.proj); if(st.log.some(x=>x.indexOf(tr(SRC.project))>=0)) proj.push(`Capstone: ${c.cap[0]} (reviewed against a rubric)`);
  return {R, c, rep, ver, fam, proj, exp:lines(R.exp), ach:lines(R.ach)};
}
function resBody(M){
  const R=M.R, sec=(t2,inner)=>inner?`<h2>${t2}</h2>${inner}`:'', ul=a=>a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
  const contact=[R.city,R.email,R.phone].filter(Boolean).map(esc).join(' · ');
  const skills=(M.ver.length?`<li><b>Verified:</b> ${M.ver.map(x=>`${esc(SK[x.k].n[0])} — ${LEVELS[x.v][0]} (${SRC[x.src]?SRC[x.src][0].toLowerCase():'test'})`).join('; ')}</li>`:'')+
    (M.fam.length?`<li><b>Also familiar with (self-reported):</b> ${M.fam.map(x=>esc(SK[x.k].n[0])).join(', ')}</li>`:'');
  return `<h1>${esc(R.name||'Your name')}</h1><div class="cv-c">${contact}</div><div class="cv-r">Target role: ${esc(M.c.n[0])}</div>`+
    sec('Professional Summary', R.summary?`<p>${esc(R.summary)}</p>`:'')+
    sec('Skills', skills?`<ul>${skills}</ul>`:'')+
    sec('Education', R.edu?`<p>${esc(R.edu)}</p>`:'')+
    sec('Projects', ul(M.proj))+sec('Experience &amp; Training', ul(M.exp))+sec('Certifications &amp; Achievements', ul(M.ach))+
    (M.ver.length?`<p class="cv-f">Skill levels verified through GYANSETU assessments (demo).</p>`:'');
}
function resText(M){
  const R=M.R, out=[R.name||'', [R.city,R.email,R.phone].filter(Boolean).join(' | '), 'Target role: '+M.c.n[0], ''];
  const add=(h2,arr)=>{ if(arr.length){ out.push(h2.toUpperCase()); arr.forEach(x=>out.push('- '+x)); out.push(''); } };
  if(R.summary){ out.push('PROFESSIONAL SUMMARY', R.summary, ''); }
  add('Skills', [ ...(M.ver.length?['Verified: '+M.ver.map(x=>`${SK[x.k].n[0]} — ${LEVELS[x.v][0]}`).join('; ')]:[]), ...(M.fam.length?['Also familiar with (self-reported): '+M.fam.map(x=>SK[x.k].n[0]).join(', ')]:[]) ]);
  if(R.edu){ out.push('EDUCATION', R.edu, ''); }
  add('Projects',M.proj); add('Experience & Training',M.exp); add('Certifications & Achievements',M.ach);
  return out.join('\n').trim()+'\n';
}
function resAts(M){
  const R=M.R, text=(resText(M)).toLowerCase();
  const req=M.c.req.map(r=>r[0]);
  const have=req.filter(k=>{ const e=st.L.skills[k]; if(e && (e.v||e.s)) return true; return skillKeywords(k).some(w=>text.includes(w)); });
  const miss=req.filter(k=>!have.includes(k));
  const sw=(R.summary.match(/\S+/g)||[]).length;
  const checks=[[t('atsContact'), !!(R.email&&R.phone)], [t('atsSummary'), sw>=25&&sw<=80], [t('atsProj'), M.proj.length>0], [t('atsVer'), M.ver.length>=2]];
  return {cov:Math.round(100*have.length/req.length), miss, checks};
}
function resRight(){
  const M=resModel(), A=resAts(M);
  return `<section class="card"><div class="card-h"><h3>${t('resAts',{x:tr(M.c.n)})}</h3><span class="fitnum">${A.cov}%</span></div>
    <div class="note">${t('resCoverage')}</div><div class="meter" style="height:8px"><i style="width:${A.cov}%"></i></div>
    ${A.miss.length?`<p class="note">${t('resMissing',{x:A.miss.map(sn).join(', ')})} · <button type="button" class="linkbtn" data-page="path">${tr(S.nav.path)}</button></p>`:''}
    <ul class="checks-list">${A.checks.map(([l,ok])=>`<li><span class="badge ${ok?'b-ver':'b-gap'}">${ok?'✓':'!'}</span> ${l}</li>`).join('')}</ul></section>
    <section class="card" style="margin-top:16px"><div class="card-h"><h3>${t('resPreview')}</h3><div class="row">
      <button type="button" class="btn sm" data-act="res-dl">${t('resDownload')}</button><button type="button" class="btn sm ghost" data-act="res-copy" id="res-copy-btn">${t('resCopy')}</button></div></div>
      <div class="cv">${resBody(M)}</div><p class="note" id="res-msg">${t('resDlNote')}</p></section>`;
}
function pResume(){
  const R=resState();
  let h=head(tr(S.nav.resume),t('resPage'),`<div class="row">${aiBadge()}</div>`);
  const f=(id,label,val,rows)=>`<div class="fld"><label for="res-${id}">${label}</label>${rows?`<textarea id="res-${id}" rows="${rows}">${esc(val)}</textarea>`:`<input id="res-${id}" value="${esc(val)}">`}</div>`;
  h+=`<div class="res-grid"><section class="card"><div class="card-h"><h3>${t('resDetails')}</h3></div>
    <div class="fld2">${f('name',t('fName'),R.name)}${f('city',t('fCity'),R.city)}${f('email',t('fEmail'),R.email)}${f('phone',t('fPhone'),R.phone)}</div>
    ${f('summary',t('fSummary'),R.summary,4)}
    <div class="row" style="margin:-4px 0 10px"><button type="button" class="btn sm ghost" data-act="res-suggest">${t('resSuggest')}</button>${st.ai?`<button type="button" class="btn sm" data-act="res-ai" id="res-ai-btn">${t('resPolish')}</button>`:''}</div>
    ${st.ai?`<p class="note" style="margin-top:-6px">${t('resAiNote')}</p>`:''}
    ${f('edu',t('fEdu'),R.edu)}${f('proj',t('fProj'),R.proj,3)}${f('exp',t('fExp'),R.exp,3)}${f('ach',t('fAch'),R.ach,2)}
    <p class="note">${t('resNote')}</p></section><div id="res-right">${resRight()}</div></div>`;
  return h;
}
function resRefresh(){ const el=document.getElementById('res-right'); if(el) el.innerHTML=resRight(); }
async function resPolish(btn){
  const R=resState(), c=goal(), rep=gapReport(st.L,c);
  btn.disabled=true; btn.textContent=t('resWorking');
  try{
    const out=await st.ai.json(`You improve entry-level resumes for job seekers in India. Use ONLY the facts below; never invent employers, dates, numbers, certificates or skills.
Target role: ${c.n[0]}. ${factsFor(st.L,c,rep)}
Current summary: ${R.summary}
Projects (one per line):\n${R.proj}
Experience (one per line):\n${R.exp}
Reply with only JSON: {"summary": "2-3 sentences, 40-70 words, in English", "projects": ["each project rewritten as one strong action-verb line"], "experience": ["each experience line rewritten the same way"]}. Keep the same number of project and experience lines.`, {cache:false});
    if(out && typeof out.summary==='string'){ R.summary=out.summary.trim();
      if(Array.isArray(out.projects) && out.projects.length) R.proj=out.projects.map(String).join('\n');
      if(Array.isArray(out.experience) && out.experience.length && R.exp.trim()) R.exp=out.experience.map(String).join('\n'); }
    render();
  }catch(e){ handleAiError(e); btn.disabled=false; btn.textContent=t('resPolish'); const m=document.getElementById('res-msg'); if(m) m.textContent=t('resAiErr'); if(!st.ai) render(); }
}
function resDocument(M){
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${esc(M.R.name||'Resume')} – Resume</title><style>
body{font-family:Arial,Helvetica,sans-serif;color:#111;max-width:760px;margin:36px auto;padding:0 24px;line-height:1.45;font-size:14px}
h1{font-size:26px;margin:0}.cv-c{color:#444;margin-top:4px}.cv-r{color:#1F3A93;font-weight:bold;margin-top:4px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #999;padding-bottom:3px;margin:18px 0 6px;color:#1F3A93}
ul{margin:4px 0;padding-left:20px}p{margin:4px 0}.cv-f{color:#666;font-size:11px;margin-top:18px}
@media print{body{margin:0}}</style></head><body>${resBody(M)}</body></html>`;
}

// ---------------- toolkit card on dashboard ----------------
function toolkitCard(){
  return `<section class="card"><div class="card-h"><h3>${t('toolkit')}</h3>${aiBadge()}</div><p class="note" style="margin:-6px 0 10px">${t('toolkitSub')}</p>
   <div class="tk">${['practice','interview','resume'].map(p=>`<button type="button" data-page="${p}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICONS[p]}</svg><span>${tr(S.nav[p])}</span></button>`).join('')}</div></section>`;

// ---------------- events for the toolkit ----------------
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='pq-skill'){ pqStart(b.dataset.k); render(); }
  else if(a==='pq-opt'){ st.pq.chosen=+b.dataset.j; render(); }
  else if(a==='pq-check'){ const q=st.pq.qs[st.pq.i]; st.pq.checked=true; if(st.pq.chosen===q[2]) st.pq.score++; render(); }
  else if(a==='pq-next'){ if(st.pq.i+1<st.pq.qs.length){ st.pq.i++; st.pq.chosen=null; st.pq.checked=false; } else { st.pq.done=true; st.log.unshift(`${sn(st.pq.skill)}: ${t('pqScore',{a:st.pq.score,b:st.pq.qs.length})}`); } render(); }
  else if(a==='pq-retry'){ pqStart(st.pq.skill, st.pq.source==='ai'?st.pq.qs:null, st.pq.source); render(); }
  else if(a==='pq-ai'){ if(st.ai) pqGenerate(); }
  else if(a==='iv-start'){ st.iv.type=document.getElementById('iv-type').value; st.iv.lang=document.getElementById('iv-lang').value; ivStart(); }
  else if(a==='iv-send'){ ivSend(); }
  else if(a==='iv-end'){ ivFinish(st.iv); render(); }
  else if(a==='iv-new'){ ivReset(); render(); }
  else if(a==='res-suggest'){ resState().summary=templateSummary(); render(); }
  else if(a==='res-ai'){ if(st.ai) resPolish(b); }
  else if(a==='res-copy'){ const txt=resText(resModel()); try{ await navigator.clipboard.writeText(txt); b.textContent=t('resCopied'); }
      catch(_){ const ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); b.textContent=t('resCopied'); }catch(__){} ta.remove(); } }
  else if(a==='res-dl'){ const M=resModel(), msg=document.getElementById('res-msg');
      if(!st.dl){ if(msg) msg.textContent=t('resDlUnavail'); return; }
      try{ await st.dl.save({filename:(M.R.name||'Resume').replace(/[^\w\s.-]/g,'').trim().replace(/\s+/g,'_')+'_Resume.html', data:resDocument(M)}); if(msg) msg.textContent=t('resSaved')+'. '+t('resDlNote'); }
      catch(err){ if(msg) msg.textContent = err && err.code==='declined' ? t('resDlNote') : t('resDlUnavail'); } }
});
document.addEventListener('input', e=>{

  document.getElementById('tag').textContent=t('tag');

function render(){
  renderChrome(); const v=document.getElementById('view');
  if(st.who==='own' && !st.L){ v.innerHTML=pOwn(); return; }
  if(st.page!=='dash' && st.page!=='careers' && st.page!=='profile' && !goal()){ v.innerHTML=head(tr(S.nav[st.page]),t('noGoal')); return; }

  if(r) r.addEventListener('input',e=>{ e.target.previousElementSibling.querySelector('b').textContent=e.target.value; });
  const gs=document.getElementById('goalSel'); if(gs) gs.addEventListener('change',e=>{ st.goal[st.who]=e.target.value; st.iv=null; st.pq=null; render(); });
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.lang){ st.lang=b.dataset.lang; try{localStorage.setItem('vd-lang',st.lang)}catch(_){} render(); }
  else if(b.dataset.page){ st.page=b.dataset.page; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(b.dataset.goal){ st.goal[st.who]=b.dataset.goal; st.iv=null; st.pq=null; render(); }
  else if(b.dataset.showall){ st.showAll=true; render(); }
  else if(b.dataset.ask){ const i=+b.dataset.ask; st.chat.push({u:i},{a:i}); st.page='assistant'; render(); }
  else if(b.dataset.pass){ const k=b.dataset.pass, c=goal(), T=c.req.find(r=>r[0]===k)[1];
    const e2=st.L.skills[k]||(st.L.skills[k]={s:0}); const before=gapReport(st.L,c).shown;
    e2.v=Math.min(T,Math.floor(Math.max(e2.v||0,effLevel(e2)))+1); e2.src='mcq';
    const after=gapReport(st.L,c).shown; st.log.unshift(`${sn(k)}: ${tr(SRC.mcq)} → ${lvl(e2.v)} · ${t('readiness')} ${fmt(before,1)} → ${fmt(after,1)}`); render(); }
  else if(b.dataset.project){ const c=goal(), before=gapReport(st.L,c).shown;
    c.req.forEach(([k,T,I])=>{ const e2=st.L.skills[k]; if(e2&&e2.v&&e2.v<T&&I>=2){ e2.v=Math.min(T,e2.v+1); e2.src='project'; } });
    const after=gapReport(st.L,c).shown; st.log.unshift(`${t('capstone')}: ${tr(SRC.project)} · ${t('readiness')} ${fmt(before,1)} → ${fmt(after,1)}`); render(); }
  else if(b.dataset.reset){ const g=st.goal[st.who]; loadLearner(st.who); st.goal[st.who]=g; render(); }
});
document.addEventListener('change',e=>{ if(e.target.id==='whoSel'){ const id=e.target.value; if(id==='own'){ st.who='own'; st.L=null; st.ownL=null; } else loadLearner(id); st.page='dash'; st.showAll=false; render(); } });
document.addEventListener('submit',e=>{ if(e.target.id==='ownform'){ e.preventDefault(); submitOwn(e.target); } });
try{ const l=localStorage.getItem('vd-lang'); if(l && LI[l]!==undefined) st.lang=l; }catch(_){}
loadLearner('priya'); render();
